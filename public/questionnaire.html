<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能助手信任度问卷</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Microsoft YaHei', 'SimHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: #e4e8ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Dialog window ── */
    .dialog {
      background: #f0f0f0;
      border: 1px solid #888;
      border-radius: 3px;
      width: 820px;
      max-width: 100%;
      box-shadow: 6px 6px 24px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
    }

    /* ── Title bar ── */
    .titlebar {
      background: linear-gradient(180deg, #3a7bd5 0%, #2563c0 100%);
      color: white;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
      user-select: none;
      border-radius: 3px 3px 0 0;
    }
    .titlebar svg { flex-shrink: 0; }
    .titlebar-title { flex: 1; }
    .ws-badge {
      font-size: 11px;
      font-weight: normal;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: default;
    }
    .ws-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      transition: background 0.3s;
    }
    .ws-dot.connected { background: #44ff88; box-shadow: 0 0 6px #44ff88; }
    .ws-dot.error     { background: #ff4444; }

    /* ── Body ── */
    .body { padding: 20px 28px 28px; }

    /* ── Info rows ── */
    .info-row {
      display: flex;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 15px;
    }
    .info-row .subject-name { font-weight: bold; }
    .info-row .exp-no { color: #1a5fb4; font-weight: bold; }

    .attr-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .attr-label { color: #cc0000; font-weight: bold; }
    .attr-label + select { margin-right: 8px; }

    select.attr-select {
      padding: 2px 6px;
      border: 1px solid #7a9ab5;
      border-radius: 2px;
      font-size: 13px;
      background: white;
      font-family: inherit;
      cursor: default;
      outline: none;
    }
    select.attr-select.highlight {
      background: #0055cc;
      color: white;
      border-color: #003399;
    }

    .instruction {
      font-size: 13px;
      color: #333;
      margin-bottom: 20px;
    }

    /* ── Validation error ── */
    .error-banner {
      background: #fff0f0;
      border: 1px solid #e74c3c;
      border-radius: 3px;
      padding: 8px 14px;
      margin-bottom: 16px;
      color: #c0392b;
      font-size: 13px;
      display: none;
    }
    .error-banner.show { display: block; }

    /* ── Table ── */
    table.q-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table.q-table thead tr {
      border-bottom: 2px solid #b0b0b0;
    }
    table.q-table thead th {
      padding: 8px 4px;
      font-weight: bold;
      color: #333;
      text-align: center;
      white-space: nowrap;
    }
    table.q-table thead th:first-child {
      text-align: left;
      padding-left: 6px;
      width: 44%;
      color: #222;
    }
    table.q-table tbody tr {
      border-bottom: 1px solid #e8e8e8;
      transition: background 0.15s;
    }
    table.q-table tbody tr:nth-child(even) { background: #f7f7f7; }
    table.q-table tbody tr.unanswered   { background: #fff5f5 !important; }

    table.q-table td {
      padding: 11px 4px;
      text-align: center;
    }
    table.q-table td:first-child {
      text-align: left;
      padding-left: 6px;
      color: #222;
      line-height: 1.5;
    }
    table.q-table td label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      cursor: pointer;
    }
    table.q-table input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #2563c0;
    }

    /* ── Progress ── */
    .progress-line {
      margin-top: 14px;
      font-size: 12px;
      color: #888;
      text-align: right;
    }

    /* ── Submit ── */
    .submit-area { margin-top: 20px; text-align: center; }

    .btn-submit {
      padding: 10px 72px;
      background: #22aa22;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.1em;
      box-shadow: 0 2px 6px rgba(0,120,0,0.25);
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) { background: #1a8a1a; }
    .btn-submit:disabled { background: #88bb88; cursor: not-allowed; }

    .success-box {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 32px;
      background: #e8f8e8;
      border: 1px solid #4caf50;
      border-radius: 4px;
      color: #2e7d32;
      font-weight: bold;
      font-size: 15px;
    }
    .success-box.show {
      display: inline-flex;
    }

    /* ── Loading skeleton ── */
    .loading {
      text-align: center;
      color: #888;
      padding: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="dialog" id="dialog">
  <!-- Title bar -->
  <div class="titlebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    <span class="titlebar-title" id="titleText">智能助手信任度问卷</span>
    <span class="ws-badge" id="wsBadge">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsLabel">未连接</span>
    </span>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Info row -->
    <div class="info-row">
      <span><strong>被试姓名：</strong><span class="subject-name" id="displayUserId">-</span></span>
      <span class="exp-no">实验序号：<span id="displayExpNo">-</span></span>
    </div>

    <!-- Attributes row -->
    <div class="attr-row">
      <span class="attr-label">任务类型：</span>
      <select class="attr-select" id="selTaskType" disabled></select>

      <span class="attr-label">任务难度：</span>
      <select class="attr-select" id="selDifficulty" disabled></select>

      <span class="attr-label">自主等级：</span>
      <select class="attr-select" id="selAutonomy" disabled></select>
    </div>

    <!-- Instruction -->
    <div class="instruction">请根据您的真实体验，在每个题目后选择一个最符合您看法的评价。</div>

    <!-- Validation error -->
    <div class="error-banner" id="errorBanner">⚠ 请完成所有题目的评分后再提交。</div>

    <!-- Questions -->
    <div class="loading" id="loadingTip">正在加载问卷...</div>
    <table class="q-table" id="qTable" style="display:none">
      <thead>
        <tr id="tableHeader"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- Progress -->
    <div class="progress-line" id="progressLine" style="display:none">
      已完成：<span id="answeredCount">0</span> / <span id="totalCount">0</span> 题
    </div>

    <!-- Submit -->
    <div class="submit-area" id="submitArea" style="display:none">
      <button class="btn-submit" id="btnSubmit" onclick="handleSubmit()">提交</button>
      <div class="success-box" id="successBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        提交成功！感谢您的参与。
      </div>
    </div>

  </div><!-- /body -->
</div><!-- /dialog -->

<script>
/* ═══════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════ */
let config       = null;
let answers      = {};   // { questionId: value(1‑5) }
let contextData  = {};   // filled from URL params or WS
let ws           = null;
let wsConnected  = false;

/* ═══════════════════════════════════════════════════════
   URL Params
═══════════════════════════════════════════════════════ */
function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    userId:       p.get('userId')       || '',
    taskType:     p.get('taskType')     || 'RADAR_TARGETING',
    difficulty:   p.get('difficulty')   || '',
    autonomyLevel: p.get('autonomyLevel') || p.get('autonomy_level') ||
      p.get('AIAutonomyLevel') || p.get('AIAutonomyLeve') || '',
    isPractice:   p.get('isPractice')   === 'true',
    experimentNo: p.get('experimentNo') || p.get('current') || '-',
    total:        p.get('total')        || '-',
  };
}

/* ═══════════════════════════════════════════════════════
   WebSocket
═══════════════════════════════════════════════════════ */
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${location.host}/ws`;
  try {
    ws = new WebSocket(url);
  } catch(e) {
    setWSStatus('error', '连接失败');
    return;
  }

  ws.onopen = () => {
    wsConnected = true;
    setWSStatus('connected', '已连接');
  };

  ws.onclose = () => {
    wsConnected = false;
    setWSStatus('disconnected', '未连接');
    setTimeout(connectWS, 5000);
  };

  ws.onerror = () => {
    setWSStatus('error', '连接错误');
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      // If server pushes context for this questionnaire page, apply it
      if (msg.type === 'questionnaire_context') {
        applyContext(msg);
      }
    } catch(_) {}
  };
}

function setWSStatus(state, label) {
  const dot   = document.getElementById('wsDot');
  const lbl   = document.getElementById('wsLabel');
  dot.className = 'ws-dot ' + state;
  lbl.textContent = label;
}

function sendWS(payload) {
  if (ws && wsConnected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
    return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════
   Apply context (from URL params or WS push)
═══════════════════════════════════════════════════════ */
function applyContext(ctx) {
  contextData = { ...contextData, ...ctx };
  renderContext();
}

function renderContext() {
  const { userId, taskType, difficulty, autonomyLevel, experimentNo } = contextData;

  document.getElementById('displayUserId').textContent = userId || '-';
  document.getElementById('displayExpNo').textContent  = experimentNo || '-';

  // Task type label
  const FALLBACK_TASK_LABELS = {
    RADAR_TARGETING: '传感器操作', SA_THREAT_RESPONSE: '威胁排序',
    PLATFORM_CONTROL: '平台控制', WEAPON_FIRING: '武器发射',
  };
  const taskLabel = config?.taskTypeLabels?.[taskType]
    ?? FALLBACK_TASK_LABELS[taskType] ?? taskType ?? '-';
  setSelectValue('selTaskType', taskLabel);

  // Difficulty
  const diffLabels = config?.difficultyLabels || { low: '低难度', medium: '中难度', high: '高难度' };
  const diffLabel  = diffLabels[difficulty] || difficulty || '-';
  const selDiff    = document.getElementById('selDifficulty');
  setSelectValue('selDifficulty', diffLabel);
  if (difficulty === 'high') {
    selDiff.classList.add('highlight');
  } else {
    selDiff.classList.remove('highlight');
  }

  // Autonomy
  const aiLabels = config?.autonomyLabels || { L0: '低自主等级', L1: '中自主等级', L2: '高自主等级' };
  const autoLabel = aiLabels[autonomyLevel] || autonomyLevel || '-';
  setSelectValue('selAutonomy', autoLabel);

  // Title
  const title = config?.taskTitles?.[taskType] ?? config?.title ?? '智能助手信任度问卷';
  document.getElementById('titleText').textContent = title;
  document.title = title;
}

function setSelectValue(id, value) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  const opt = document.createElement('option');
  opt.value = value;
  opt.textContent = value;
  sel.appendChild(opt);
  sel.value = value;
}

/* ═══════════════════════════════════════════════════════
   Load config & build table
═══════════════════════════════════════════════════════ */
async function loadConfig() {
  try {
    const res = await fetch('/questionnaire_config.json');
    config = await res.json();
  } catch(e) {
    console.warn('无法加载 questionnaire_config.json，使用默认配置');
    config = {
      title: '智能助手信任度问卷',
      scales: ['非常不同意', '不同意', '一般', '同意', '非常同意'],
      questions: [
        { id: 1, text: '我对智能助手有信心。' },
        { id: 2, text: '智能助手让我感到安心。' },
        { id: 3, text: '智能助手诚实可信。' },
        { id: 4, text: '智能助手值得依赖。' },
        { id: 5, text: '智能助手运行稳定可靠。' },
        { id: 6, text: '我愿意信任智能助手。' },
        { id: 7, text: '我熟悉智能助手。' },
      ],
    };
  }

  buildTable();
  renderContext();

  document.getElementById('loadingTip').style.display   = 'none';
  document.getElementById('qTable').style.display       = 'table';
  document.getElementById('progressLine').style.display = 'block';
  document.getElementById('submitArea').style.display   = 'block';
}

function buildTable() {
  const scales    = config.scales || ['非常不同意', '不同意', '一般', '同意', '非常同意'];
  const questions = config.questions || [];

  // Header
  const headerRow = document.getElementById('tableHeader');
  headerRow.innerHTML = '';
  const thQ = document.createElement('th');
  thQ.textContent = '题目';
  thQ.style.textAlign = 'left';
  headerRow.appendChild(thQ);
  scales.forEach(s => {
    const th = document.createElement('th');
    th.textContent = s;
    headerRow.appendChild(th);
  });

  // Body
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  document.getElementById('totalCount').textContent = questions.length;

  questions.forEach(q => {
    const tr = document.createElement('tr');
    tr.id = `row_${q.id}`;

    const tdQ = document.createElement('td');
    tdQ.textContent = `${q.id}. ${q.text}`;
    tdQ.style.textAlign = 'left';
    tr.appendChild(tdQ);

    scales.forEach((_, idx) => {
      const val = idx + 1;
      const td  = document.createElement('td');
      const lbl = document.createElement('label');
      const inp = document.createElement('input');
      inp.type  = 'radio';
      inp.name  = `q_${q.id}`;
      inp.value = val;
      inp.addEventListener('change', () => onAnswer(q.id, val));
      lbl.appendChild(inp);
      td.appendChild(lbl);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

/* ═══════════════════════════════════════════════════════
   Answer tracking
═══════════════════════════════════════════════════════ */
function onAnswer(qId, val) {
  answers[qId] = val;
  // Clear error highlight on this row
  const row = document.getElementById(`row_${qId}`);
  if (row) row.classList.remove('unanswered');
  // Hide banner if all answered
  const qs = config.questions || [];
  if (qs.every(q => answers[q.id] !== undefined)) {
    document.getElementById('errorBanner').classList.remove('show');
  }
  updateProgress();
}

function updateProgress() {
  document.getElementById('answeredCount').textContent = Object.keys(answers).length;
}

/* ═══════════════════════════════════════════════════════
   Submit
═══════════════════════════════════════════════════════ */
function handleSubmit() {
  const qs = config.questions || [];
  const unanswered = qs.filter(q => answers[q.id] === undefined);

  if (unanswered.length > 0) {
    // Show validation error
    document.getElementById('errorBanner').classList.add('show');
    unanswered.forEach(q => {
      const row = document.getElementById(`row_${q.id}`);
      if (row) row.classList.add('unanswered');
    });
    // Scroll to first unanswered
    const firstRow = document.getElementById(`row_${unanswered[0].id}`);
    if (firstRow) firstRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;

  const { userId, taskType, difficulty, autonomyLevel, isPractice, experimentNo, total } = contextData;

  const payload = {
    type:               'questionnaire_submitted',
    taskType:           taskType || 'RADAR_TARGETING',
    userId:             userId || '',
    repetitionCurrent:  parseInt(experimentNo) || 0,
    repetitionTotal:    parseInt(total) || 0,
    answers:            { ...answers },
    taskInfo: {
      difficulty:  difficulty || null,
      autonomyLevel: autonomyLevel || null,
      isPractice:  !!isPractice,
    },
    timestamp: Date.now(),
    source: 'html_page',
  };

  const sent = sendWS(payload);
  if (!sent) {
    // Fallback: POST to /api/questionnaire if WS unavailable
    fetch('/api/questionnaire', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  // Show success
  document.getElementById('successBox').classList.add('show');
  btn.style.display = 'none';

  // Auto-close after 2s if opened as popup
  if (window.opener || window.parent !== window) {
    setTimeout(() => window.close(), 2000);
  }
}

/* ═══════════════════════════════════════════════════════
   Init
═══════════════════════════════════════════════════════ */
(async function init() {
  // 1. Parse URL params first
  const params = getParams();
  contextData = { ...params };

  // 2. Load config (needed before renderContext)
  await loadConfig();

  // 3. Pre-fill answers from URL (e.g. q1=5&q2=3)
  prefillAnswersFromURL();

  // 4. Connect WS
  connectWS();
})();

function prefillAnswersFromURL() {
  const p = new URLSearchParams(window.location.search);
  const qs = config?.questions || [];
  qs.forEach(q => {
    const val = parseInt(p.get(`q${q.id}`));
    if (!val || val < 1 || val > (config.scales || []).length) return;
    const radio = document.querySelector(`input[name="q_${q.id}"][value="${val}"]`);
    if (radio) {
      radio.checked = true;
      onAnswer(q.id, val);
    }
  });
}
</script>
</body>
</html>
