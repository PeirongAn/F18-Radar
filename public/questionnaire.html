<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>座舱认知状态问卷</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Microsoft YaHei', 'SimHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: #dfe7f1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    /* ── Dialog window ── */
    .dialog {
      background: #f6f8fb;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 12px;
      width: min(1500px, calc(100vw - 24px));
      height: calc(100vh - 24px);
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.28);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Title bar ── */
    .titlebar {
      background: #1f5fbf;
      color: white;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      user-select: none;
      border-radius: 12px 12px 0 0;
      flex-shrink: 0;
    }
    .titlebar svg { flex-shrink: 0; }
    .titlebar-title { flex: 1; }
    .ws-badge {
      font-size: 11px;
      font-weight: normal;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: default;
    }
    .ws-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      transition: background 0.3s;
    }
    .ws-dot.connected { background: #44ff88; box-shadow: 0 0 6px #44ff88; }
    .ws-dot.error     { background: #ff4444; }

    /* ── Body ── */
    .body {
      padding: 18px 28px 24px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    /* ── Info rows ── */
    .info-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      align-items: center;
      color: #475569;
    }
    .info-row .subject-name {
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      background: #e9f7ef;
      border: 1px solid #b7e4c7;
      color: #047857;
    }
    .info-row .exp-no { color: #1a5fb4; font-weight: bold; }

    .attr-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #475569;
    }
    .attr-label { color: #475569; font-weight: 400; }
    .attr-label + select { margin-right: 8px; }

    select.attr-select {
      padding: 5px 10px;
      border: 1px solid #b9c7d6;
      border-radius: 6px;
      font-size: 13px;
      background: #f8fafc;
      color: #14532d;
      -webkit-text-fill-color: #14532d;
      opacity: 1;
      font-family: inherit;
      font-weight: 600;
      cursor: default;
      outline: none;
    }

    .instruction {
      font-size: 14px;
      color: #334155;
      margin-bottom: 18px;
      padding: 12px 14px;
      background: #eef4fb;
      border: 1px solid #d7e2ef;
      border-radius: 8px;
      line-height: 1.6;
    }

    /* ── Validation error ── */
    .error-banner {
      background: #fff0f0;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      color: #c0392b;
      font-size: 14px;
      display: none;
    }
    .error-banner.show { display: block; }

    /* ── Questions ── */
    .q-list {
      display: grid;
      gap: 10px;
    }
    .q-card {
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 12px 14px 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .q-card.unanswered {
      background: #fff7ed;
      border-color: #fb923c;
    }
    .q-title {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .q-number {
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #edf2f7;
      color: #475569;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .q-card.answered .q-number {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .q-text {
      color: #172033;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 600;
    }
    .option-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .option-choice {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d2dbe8;
      background: #f8fafc;
      color: #334155;
      transition: border-color 0.16s, background 0.16s;
    }
    .option-choice.selected {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1e40af;
    }
    .option-choice input[type="radio"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #2563eb;
      flex-shrink: 0;
    }
    .option-text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .option-scale {
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
    }
    .option-label {
      font-size: 12px;
      line-height: 1.35;
    }

    /* ── Progress ── */
    .progress-line {
      margin-top: 16px;
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #dbe3ee;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #2563eb;
      transition: width 0.2s;
    }
    .progress-text {
      min-width: 110px;
      text-align: right;
    }

    /* ── Submit ── */
    .submit-area { margin-top: 20px; text-align: center; }

    .btn-submit {
      min-width: 220px;
      padding: 12px 72px;
      background: #1f5fbf;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.08em;
      box-shadow: 0 10px 24px rgba(31, 95, 191, 0.26);
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-submit:hover:not(:disabled) { background: #174ea6; }
    .btn-submit:disabled { background: #93c5fd; cursor: not-allowed; }

    .success-box {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 32px;
      background: #ecfdf5;
      border: 1px solid #86efac;
      border-radius: 8px;
      color: #166534;
      font-weight: bold;
      font-size: 15px;
    }
    .success-box.show {
      display: inline-flex;
    }

    /* ── Loading skeleton ── */
    .loading {
      text-align: center;
      color: #888;
      padding: 40px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      body { padding: 8px; }
      .dialog {
        width: calc(100vw - 16px);
        height: calc(100vh - 16px);
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
      }
      .body { padding: 14px 16px 20px; }
      .option-grid { grid-template-columns: 1fr; }
      .progress-line {
        align-items: flex-start;
        flex-direction: column;
      }
      .progress-track {
        width: 100%;
        flex: none;
      }
      .progress-text {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="dialog" id="dialog">
  <!-- Title bar -->
  <div class="titlebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    <span class="titlebar-title" id="titleText">座舱认知状态问卷</span>
    <span class="ws-badge" id="wsBadge">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsLabel">未连接</span>
    </span>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Info row -->
    <div class="info-row">
      <span><strong>被试姓名：</strong><span class="subject-name" id="displayUserId">-</span></span>
    </div>

    <!-- Attributes row -->
    <div class="attr-row">
      <span class="attr-label">任务类型：</span>
      <select class="attr-select" id="selTaskType" disabled></select>

      <span class="attr-label">任务难度：</span>
      <select class="attr-select" id="selDifficulty" disabled></select>

      <span class="attr-label">自主等级：</span>
      <select class="attr-select" id="selAutonomy" disabled></select>
    </div>

    <!-- Instruction -->
    <div class="instruction">请根据刚才这段任务中的真实感受作答。没有对错，请凭第一反应选择。</div>

    <!-- Validation error -->
    <div class="error-banner" id="errorBanner">⚠ 请完成所有题目的评分后再提交。</div>

    <!-- Questions -->
    <div class="loading" id="loadingTip">正在加载问卷...</div>
    <div class="q-list" id="qTable" style="display:none"></div>

    <!-- Progress -->
    <div class="progress-line" id="progressLine" style="display:none">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text">已完成：<span id="answeredCount">0</span> / <span id="totalCount">0</span> 题</span>
    </div>

    <!-- Submit -->
    <div class="submit-area" id="submitArea" style="display:none">
      <button class="btn-submit" id="btnSubmit" onclick="handleSubmit()">提交</button>
      <div class="success-box" id="successBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        提交成功！感谢您的参与。
      </div>
    </div>

  </div><!-- /body -->
</div><!-- /dialog -->

<script>
/* ═══════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════ */
let config       = null;
let answers      = {};   // { questionId: value(1‑5) }
let contextData  = {};   // filled from URL params or WS
let ws           = null;
let wsConnected  = false;

/* ═══════════════════════════════════════════════════════
   URL Params
═══════════════════════════════════════════════════════ */
function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    userId:       p.get('userId')       || '',
    taskType:     p.get('taskType')     || '',
    taskId:       '',
    difficulty:   '',
    autonomyLevel: '',
    isPractice:   false,
    experimentNo: '-',
    total:        '-',
  };
}

/* ═══════════════════════════════════════════════════════
   WebSocket
═══════════════════════════════════════════════════════ */
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${location.host}/ws`;
  try {
    ws = new WebSocket(url);
  } catch(e) {
    setWSStatus('error', '连接失败');
    return;
  }

  ws.onopen = () => {
    wsConnected = true;
    setWSStatus('connected', '已连接');
  };

  ws.onclose = () => {
    wsConnected = false;
    setWSStatus('disconnected', '未连接');
    setTimeout(connectWS, 5000);
  };

  ws.onerror = () => {
    setWSStatus('error', '连接错误');
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      // If server pushes context for this questionnaire page, apply it
      if (msg.type === 'questionnaire_context') {
        applyContext(msg);
      }
    } catch(_) {}
  };
}

function setWSStatus(state, label) {
  const dot   = document.getElementById('wsDot');
  const lbl   = document.getElementById('wsLabel');
  dot.className = 'ws-dot ' + state;
  lbl.textContent = label;
}

function sendWS(payload) {
  if (ws && wsConnected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
    return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════
   Apply context (from URL params or WS push)
═══════════════════════════════════════════════════════ */
function applyContext(ctx) {
  contextData = { ...contextData, ...ctx };
  renderContext();
}

function renderContext() {
  const { userId, taskType, difficulty, autonomyLevel } = contextData;

  document.getElementById('displayUserId').textContent = userId || '-';

  // Task type label
  const taskLabel = config?.taskTypeLabels?.[taskType] ?? taskType ?? '-';
  setSelectValue('selTaskType', taskLabel);

  // Difficulty
  const diffLabels = config?.difficultyLabels || {};
  const diffLabel  = diffLabels[difficulty] || difficulty || '-';
  setSelectValue('selDifficulty', diffLabel);

  // Autonomy
  const aiLabels = config?.autonomyLabels || {};
  const autoLabel = aiLabels[autonomyLevel] || autonomyLevel || '-';
  setSelectValue('selAutonomy', autoLabel);

  // Title
  const title = config?.taskTitles?.[taskType] ?? config?.title ?? document.title;
  document.getElementById('titleText').textContent = title;
  document.title = title;
}

function setSelectValue(id, value) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  const opt = document.createElement('option');
  opt.value = value;
  opt.textContent = value;
  sel.appendChild(opt);
  sel.value = value;
}

// The questionnaire display is owned by the completed server-side task run,
// not by difficulty/autonomy values embedded in an externally opened URL.
// taskId is preferred when available; the API falls back to the user's most
// recent completed task of the requested type when it is absent or stale.
async function loadAuthoritativeContext() {
  const { userId, taskType } = contextData;
  const query = new URLSearchParams();
  if (userId) query.set('userId', userId);
  if (taskType) query.set('taskType', taskType);
  try {
    const response = await fetch(`/api/questionnaire/context?${query.toString()}`, {
      cache: 'no-store',
    });
    if (!response.ok) return;
    const payload = await response.json();
    if (payload?.ok && payload.type === 'questionnaire_context') {
      applyContext({
        ...payload,
        experimentNo: payload.experimentNo ?? contextData.experimentNo,
        total: payload.total ?? contextData.total,
      });
    }
  } catch (error) {
    // URL values remain the final compatibility fallback when the server is
    // unavailable or no completed task can be resolved.
    console.warn('无法读取服务端任务上下文，使用 URL 兜底值', error);
  }
}

function createEmptyConfig() {
  return {
    title: document.title || 'Questionnaire',
    taskTitles: {},
    taskTypeLabels: {},
    difficultyLabels: {},
    autonomyLabels: {},
    scales: [],
    questions: [],
  };
}

function normalizeConfig(raw) {
  const base = createEmptyConfig();
  const merged = { ...base, ...(raw || {}) };
  merged.taskTitles = merged.taskTitles || {};
  merged.taskTypeLabels = merged.taskTypeLabels || {};
  merged.difficultyLabels = merged.difficultyLabels || {};
  merged.autonomyLabels = merged.autonomyLabels || {};
  merged.scales = Array.isArray(merged.scales) ? merged.scales : [];
  merged.questions = Array.isArray(merged.questions) ? merged.questions : [];
  return merged;
}

/* ═══════════════════════════════════════════════════════
   Load config & build table
═══════════════════════════════════════════════════════ */
async function loadConfig() {
  try {
    const res = await fetch('questionnaire_config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    config = normalizeConfig(await res.json());
  } catch(e) {
    console.warn('无法加载 questionnaire_config.json，问卷内容保持为空', e);
    config = createEmptyConfig();
  }

  buildTable();
  renderContext();

  document.getElementById('loadingTip').style.display   = 'none';
  document.getElementById('qTable').style.display       = 'grid';
  document.getElementById('progressLine').style.display = 'flex';
  document.getElementById('submitArea').style.display   = 'block';
}

function buildTable() {
  const scales    = config.scales || ['1', '2', '3', '4', '5'];
  const questions = config.questions || [];

  // Body
  const list = document.getElementById('qTable');
  list.innerHTML = '';
  document.getElementById('totalCount').textContent = questions.length;

  questions.forEach(q => {
    const card = document.createElement('div');
    card.id = `row_${q.id}`;
    card.className = 'q-card';

    const title = document.createElement('div');
    title.className = 'q-title';

    const number = document.createElement('span');
    number.className = 'q-number';
    number.textContent = q.id;
    title.appendChild(number);

    const titleText = document.createElement('div');
    titleText.className = 'q-text';
    titleText.textContent = q.text;
    title.appendChild(titleText);
    card.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'option-grid';

    scales.forEach((scale, idx) => {
      const val = idx + 1;
      const optionLabel = q.options?.[idx] || scale;
      const lbl = document.createElement('label');
      lbl.className = 'option-choice';
      const inp = document.createElement('input');
      inp.type  = 'radio';
      inp.name  = `q_${q.id}`;
      inp.value = val;
      inp.addEventListener('change', () => onAnswer(q.id, val));
      lbl.appendChild(inp);

      const optionText = document.createElement('span');
      optionText.className = 'option-text';

      const scaleText = document.createElement('span');
      scaleText.className = 'option-scale';
      scaleText.textContent = scale;
      optionText.appendChild(scaleText);

      const labelText = document.createElement('span');
      labelText.className = 'option-label';
      labelText.textContent = optionLabel;
      optionText.appendChild(labelText);

      lbl.appendChild(optionText);
      grid.appendChild(lbl);
    });

    card.appendChild(grid);
    list.appendChild(card);
  });
}

/* ═══════════════════════════════════════════════════════
   Answer tracking
═══════════════════════════════════════════════════════ */
function onAnswer(qId, val) {
  answers[qId] = val;
  // Clear error highlight on this row
  const row = document.getElementById(`row_${qId}`);
  if (row) {
    row.classList.remove('unanswered');
    row.classList.add('answered');
    row.querySelectorAll('.option-choice').forEach(label => {
      const input = label.querySelector('input');
      label.classList.toggle('selected', Number(input?.value) === val);
    });
  }
  // Hide banner if all answered
  const qs = config.questions || [];
  if (qs.every(q => answers[q.id] !== undefined)) {
    document.getElementById('errorBanner').classList.remove('show');
  }
  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(answers).length;
  const totalCount = (config?.questions || []).length;
  const progressPercent = totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0;
  document.getElementById('answeredCount').textContent = answeredCount;
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = `${progressPercent}%`;
}

/* ═══════════════════════════════════════════════════════
   Submit
═══════════════════════════════════════════════════════ */
function handleSubmit() {
  const qs = config.questions || [];
  const unanswered = qs.filter(q => answers[q.id] === undefined);

  if (unanswered.length > 0) {
    // Show validation error
    document.getElementById('errorBanner').classList.add('show');
    unanswered.forEach(q => {
      const row = document.getElementById(`row_${q.id}`);
      if (row) row.classList.add('unanswered');
    });
    // Scroll to first unanswered
    const firstRow = document.getElementById(`row_${unanswered[0].id}`);
    if (firstRow) firstRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;

  const { userId, taskType, difficulty, autonomyLevel, isPractice, experimentNo, total } = contextData;
  const taskId = contextData.taskId ?? contextData.task_id;
  const timestamp = Date.now();

  const payload = {
    type:               'questionnaire_submitted',
    taskType:           taskType || 'RADAR_TARGETING',
    taskId:             taskId ? Number(taskId) || taskId : undefined,
    userId:             userId || '',
    repetitionCurrent:  parseInt(experimentNo) || 0,
    repetitionTotal:    parseInt(total) || 0,
    answers:            { ...answers },
    taskInfo: {
      difficulty:  difficulty || null,
      autonomyLevel: autonomyLevel || null,
      isPractice:  !!isPractice,
    },
    timestamp,
    source: 'html_page',
  };
  const exitPayload = {
    type: 'task_exit_request',
    reason: 'task_completed',
    task_type: taskType || 'RADAR_TARGETING',
    task_id: taskId ? Number(taskId) || taskId : undefined,
    user_id: userId || '',
    timestamp,
  };

  const sent = sendWS(payload);
  sendWS(exitPayload);
  if (!sent) {
    // Fallback: POST to /api/questionnaire if WS unavailable
    fetch('/api/questionnaire', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  // Show success
  document.getElementById('successBox').classList.add('show');
  btn.style.display = 'none';

  // Auto-close after 2s if opened as popup
  if (window.opener || window.parent !== window) {
    setTimeout(() => window.close(), 2000);
  }
}

/* ═══════════════════════════════════════════════════════
   Init
═══════════════════════════════════════════════════════ */
(async function init() {
  // 1. Parse URL params first
  const params = getParams();
  contextData = { ...params };

  // 2. Load config (needed before renderContext)
  await loadConfig();

  // 3. Prefer the server-side completed task context over URL display fields.
  await loadAuthoritativeContext();

  // 4. Pre-fill answers from URL (e.g. q1=5&q2=3)
  prefillAnswersFromURL();

  // 5. Connect WS
  connectWS();
})();

function prefillAnswersFromURL() {
  const p = new URLSearchParams(window.location.search);
  const qs = config?.questions || [];
  qs.forEach(q => {
    const val = parseInt(p.get(`q${q.id}`));
    if (!val || val < 1 || val > (config.scales || []).length) return;
    const radio = document.querySelector(`input[name="q_${q.id}"][value="${val}"]`);
    if (radio) {
      radio.checked = true;
      onAnswer(q.id, val);
    }
  });
}
</script>
</body>
</html>
